<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Your Email | Yek Languages</title>
    <meta name="description" content="Thanks for your interest in Yek Flashcards. Check your email to confirm your early-access signup.">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>

        <img src="logo-crop.png" alt="Yek Languages">

        <section class="confirmation-page">

            <h1>Check Your Email</h1>

            <p>
                Thanks for your interest in <strong>Yek Flashcards!</strong>
            </p>

            <p>
                We've sent you an email with a confirmation link.
                Click the link in that email to join the Yek Flashcards
                early-access list.
            </p>

            <p>
                If you don't see the email within a few minutes,
                check your spam or junk folder.
            </p>

            <a href="https://yeklanguages.com/" class="back-link">
                Back to Yek Languages
            </a>

        </section>

    </main>

</body>
</html>
